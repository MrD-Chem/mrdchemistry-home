<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="480" height="200">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1630"/>
      <stop offset="1" stop-color="#170a14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="480" height="200" fill="url(#sky)"/>
  <ellipse cx="240" cy="110" rx="220" ry="105" fill="url(#glow)"/>

  <!-- sparkles -->
  <g fill="#fde68a">
    <path d="M46 30l2.4 6 6 2.4-6 2.4-2.4 6-2.4-6-6-2.4 6-2.4z"/>
    <path d="M444 154l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>
  </g>
  <g fill="#f7f6f3" opacity="0.5">
    <circle cx="28" cy="128" r="1.5"/><circle cx="110" cy="18" r="1.4"/><circle cx="456" cy="44" r="1.6"/><circle cx="372" cy="16" r="1.3"/>
  </g>

  <!-- the winding path -->
  <path d="M50 160C110 160 110 100 170 100S230 150 290 140 340 70 420 56" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="16" stroke-linecap="round" transform="translate(3 5)"/>
  <path d="M50 160C110 160 110 100 170 100S230 150 290 140 340 70 420 56" fill="none" stroke="#f9a8d4" stroke-opacity="0.35" stroke-width="14" stroke-linecap="round"/>
  <path d="M50 160C110 160 110 100 170 100S230 150 290 140 340 70 420 56" fill="none" stroke="#fdf2f8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 10"/>

  <!-- stations: done, done, up next, locked, finish flag -->
  <g stroke="#fff" stroke-opacity="0.7" stroke-width="2">
    <circle cx="50" cy="160" r="15" fill="#34d399"/>
    <circle cx="170" cy="100" r="15" fill="#34d399"/>
    <circle cx="290" cy="140" r="17" fill="#f472b6"/>
    <circle cx="368" cy="78" r="13" fill="#3b2a36"/>
  </g>
  <g fill="none" stroke="#06080a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M43 160l5 5 9-10"/>
    <path d="M163 100l5 5 9-10"/>
  </g>
  <circle cx="290" cy="140" r="6" fill="#fff"/>
  <path d="M363 76h10v8h-10zM365 76v-4a3 3 0 0 1 6 0v4" fill="none" stroke="#cbb8c6" stroke-width="2"/>

  <!-- finish flag -->
  <path d="M420 56V18" stroke="#f7f6f3" stroke-width="3" stroke-linecap="round"/>
  <path d="M421 19h30l-8 9 8 9h-30z" fill="#fbbf24"/>
  <circle cx="420" cy="58" r="5" fill="#f7f6f3"/>

  <!-- little molecules along the way -->
  <g opacity="0.85">
    <circle cx="112" cy="58" r="9" fill="#fb7185"/><circle cx="126" cy="58" r="9" fill="#fb7185"/>
    <circle cx="232" cy="64" r="8" fill="#60a5fa"/><circle cx="222" cy="72" r="5" fill="#f1f5f9"/><circle cx="242" cy="72" r="5" fill="#f1f5f9"/><circle cx="232" cy="52" r="5" fill="#f1f5f9"/>
    <circle cx="352" cy="164" r="6" fill="#f1f5f9"/><circle cx="363" cy="164" r="6" fill="#f1f5f9"/>
  </g>
</svg>
