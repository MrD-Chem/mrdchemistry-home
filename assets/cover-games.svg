<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="480" height="200">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d3335"/>
      <stop offset="1" stop-color="#0a1315"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26323f"/>
      <stop offset="1" stop-color="#121a22"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="480" height="200" fill="url(#sky)"/>
  <ellipse cx="240" cy="112" rx="190" ry="110" fill="url(#glow)"/>

  <!-- neon floor -->
  <g stroke="#2dd4bf" stroke-opacity="0.22" stroke-width="1.5" fill="none">
    <path d="M0 150h480M0 162h480M0 178h480M0 198h480"/>
    <path d="M240 142 120 200M240 142 0 196M240 142 360 200M240 142 480 196M240 142v58"/>
  </g>

  <!-- sparkles -->
  <g fill="#fde68a">
    <path d="M60 28l2.4 6 6 2.4-6 2.4-2.4 6-2.4-6-6-2.4 6-2.4z"/>
    <path d="M452 44l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>
    <path d="M300 30l1.6 4 4 1.6-4 1.6-1.6 4-1.6-4-4-1.6 4-1.6z" opacity="0.8"/>
  </g>
  <g fill="#f7f6f3" opacity="0.55">
    <circle cx="160" cy="24" r="1.6"/><circle cx="350" cy="52" r="1.4"/><circle cx="24" cy="80" r="1.4"/><circle cx="458" cy="96" r="1.6"/>
  </g>

  <!-- left: a balance scale with equal atoms (Balance Quest) -->
  <g transform="translate(34 46)">
    <path d="M14 22h88" stroke="#a78bfa" stroke-width="6" stroke-linecap="round"/>
    <rect x="54" y="22" width="8" height="70" rx="2" fill="#6b7280"/>
    <rect x="36" y="90" width="44" height="9" rx="3" fill="#4b5563"/>
    <circle cx="58" cy="22" r="7" fill="#2dd4bf"/>
    <path d="M14 22 4 50M14 22l10 28M102 22 92 50M102 22l10 28" stroke="#94a3b8" stroke-width="1.6"/>
    <path d="M1 50h26a13 7 0 0 1-26 0zM89 50h26a13 7 0 0 1-26 0z" fill="#fbbf24"/>
    <circle cx="9" cy="46" r="4.5" fill="#fb7185"/><circle cx="19" cy="46" r="4.5" fill="#f8fafc"/>
    <circle cx="97" cy="46" r="4.5" fill="#f8fafc"/><circle cx="107" cy="46" r="4.5" fill="#fb7185"/>
  </g>

  <!-- centre: a glowing game controller with atom buttons -->
  <path d="M190 72h100c22 0 34 14 38 34l8 36c3 16-14 26-26 14l-20-20H190l-20 20c-12 12-29 2-26-14l8-36c4-20 16-34 38-34z" fill="none" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="12" stroke-linejoin="round"/>
  <path d="M190 72h100c22 0 34 14 38 34l8 36c3 16-14 26-26 14l-20-20H190l-20 20c-12 12-29 2-26-14l8-36c4-20 16-34 38-34z" fill="url(#pad)" stroke="#2dd4bf" stroke-width="3" stroke-linejoin="round"/>
  <path d="M184 92h12v-8h8v8h12v8h-12v8h-8v-8h-12z" transform="translate(-6 4)" fill="#cbd5e1"/>
  <g stroke="#94a3b8" stroke-width="2" stroke-opacity="0.7">
    <path d="M290 92v24M278 104h24"/>
  </g>
  <circle cx="290" cy="92" r="7" fill="#2dd4bf"/>
  <circle cx="302" cy="104" r="7" fill="#fbbf24"/>
  <circle cx="290" cy="116" r="7" fill="#fb7185"/>
  <circle cx="278" cy="104" r="7" fill="#a78bfa"/>
  <g fill="url(#ball)">
    <circle cx="290" cy="92" r="7"/><circle cx="302" cy="104" r="7"/><circle cx="290" cy="116" r="7"/><circle cx="278" cy="104" r="7"/>
  </g>
  <rect x="226" y="114" width="12" height="5" rx="2.5" fill="#64748b"/>
  <rect x="242" y="114" width="12" height="5" rx="2.5" fill="#64748b"/>
  <!-- tiny flask badge in the middle -->
  <path d="M236 84v8l-7 12c-1 2 0 4 2 4h18c2 0 3-2 2-4l-7-12v-8" fill="none" stroke="#f7f6f3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M232.5 98h15l3.5 6.2c.6 1.4-.2 2.6-1.6 2.6h-18.8c-1.4 0-2.2-1.2-1.6-2.6z" fill="#2dd4bf"/>

  <!-- right: a runner leaping over a hurdle (Variable Dash) -->
  <g transform="translate(360 44)">
    <path d="M10 106h86" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8"/>
    <path d="M58 106V82M84 106V82M54 82h34" stroke="#fb7185" stroke-width="4" stroke-linecap="round"/>
    <!-- the runner is in mid-air, lifted clear of the crossbar -->
    <g transform="translate(0 -14)">
      <g stroke="#fbbf24" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M52 40 44 64"/>
        <path d="M44 64l18 4 12-6"/>
        <path d="M44 64 30 72l-12-4"/>
        <path d="M50 46l14 8 10-6"/>
        <path d="M50 46 36 44l-8 8"/>
      </g>
      <circle cx="56" cy="28" r="9" fill="#fbbf24"/>
      <path d="M10 56h12M4 66h14M14 76h8" stroke="#fde68a" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- floating molecules -->
  <g transform="translate(176 22)">
    <path d="M14 14 4 24M14 14l10 10" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <circle cx="14" cy="14" r="7" fill="#fb7185"/><circle cx="4" cy="24" r="4.5" fill="#f8fafc"/><circle cx="24" cy="24" r="4.5" fill="#f8fafc"/>
  </g>
  <g transform="translate(372 6)">
    <path d="M10 12h40M10 18h40" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="10" cy="15" r="6.5" fill="#fb7185"/><circle cx="30" cy="15" r="7" fill="#64748b"/><circle cx="50" cy="15" r="6.5" fill="#fb7185"/>
  </g>
  <g fill="none" stroke="#5eead4" stroke-opacity="0.7" stroke-width="1.8">
    <circle cx="138" cy="34" r="5"/><circle cx="150" cy="18" r="3"/><circle cx="330" cy="62" r="4"/>
  </g>
</svg>
